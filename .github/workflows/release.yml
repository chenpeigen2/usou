name: 发布工作台

# 发版本：push 一个 v* 的 tag（如 v1.7.39）即自动构建并发布 GitHub Release。
# 也可在 Actions 页面手动触发（workflow_dispatch），用于不发 tag 也想出包时。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.7.39）；留空则用 package.json 的版本'
        required: false
        type: string

permissions:
  contents: write   # 创建 Release / 上传资产需要写权限

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workbench-electron/package-lock.json

      - name: 解析并校验版本
        id: ver
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content 'workbench-electron/package.json' -Raw | ConvertFrom-Json).version
          $tagVersion = ''
          if ("${{ github.ref_type }}" -eq 'tag') {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          } elseif ("${{ inputs.version }}" -ne '') {
            $tagVersion = "${{ inputs.version }}".TrimStart('v')
          }
          if ($tagVersion -and $tagVersion -ne $pkgVersion) {
            Write-Error "版本不一致：tag/输入=$tagVersion，package.json=$pkgVersion。请先更新 package.json 版本再打 tag。"
            exit 1
          }
          "version=$pkgVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "发布版本: $pkgVersion"

      - name: 安装依赖（npm ci，按 lockfile 可复现）
        working-directory: workbench-electron
        run: npm ci

      - name: 构建 NSIS 安装包
        working-directory: workbench-electron
        shell: pwsh
        env:
          # 国内镜像，避免 GitHub 下载 Electron 二进制超时/被墙
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          npx electron-builder --win --config electron-builder.ci.yml --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 构建失败" }

      - name: 生成便携版 zip
        working-directory: workbench-electron
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path 'out\win-unpacked\*' -DestinationPath "out\Workbench-$ver-portable.zip" -Force
          $setup = "out\Workbench-Setup-$ver.exe"
          $zip   = "out\Workbench-$ver-portable.zip"
          if (-not (Test-Path $setup)) { throw "安装包缺失: $setup" }
          if (-not (Test-Path $zip))   { throw "便携包缺失: $zip" }
          "安装包: $([math]::Round((Get-Item $setup).Length/1MB,2)) MB"
          "便携包: $([math]::Round((Get-Item $zip).Length/1MB,2)) MB"

      - name: 校验产物版本
        working-directory: workbench-electron
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $exe = "out\win-unpacked\工作台.exe"
          $pv = (Get-Item $exe).VersionInfo.ProductVersion
          if ($pv -notlike "$ver*") { throw "exe 版本 $pv 与期望 $ver 不一致" }
          Write-Host "产物版本校验通过: $pv"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 工作台 v${{ steps.ver.outputs.version }}
          body: |
            ## 工作台 v${{ steps.ver.outputs.version }}

            本机项目管理 / 空间分析 / 快速启动的桌面应用。纯本地、零运行时依赖、对用户项目文件只读。

            ### 下载地址
            - **安装版**：`Workbench-Setup-${{ steps.ver.outputs.version }}.exe`（NSIS，可选安装目录）
            - **便携版**：`Workbench-${{ steps.ver.outputs.version }}-portable.zip`（解压即用）

            > 首次运行若被 SmartScreen 拦截，选择「更多信息 → 仍要运行」（本项目未购买代码签名证书）。

            完整变更记录见仓库 `DECISIONS.md`。
          files: |
            workbench-electron/out/Workbench-Setup-*.exe
            workbench-electron/out/Workbench-*-portable.zip
          fail_on_unmatched_files: true
